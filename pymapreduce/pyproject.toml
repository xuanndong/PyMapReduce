[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pymapreduce-core"
description = "A high-performance MapReduce framework in Rust with Python async/await bindings"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "MapReduce Team" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "cloudpickle>=3.0.0"
]

[project.scripts]
mapreduce = "pymapreduce.cli:main"

[tool.maturin]
python-source = "python"
module-name = "pymapreduce._pymapreduce"
