name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux Wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.13.0

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install maturin cloudpickle

      - name: Build wheels and sdist
        working-directory: pymapreduce
        run: |
          maturin build --release --zig --manylinux 2_28
          maturin sdist

      - name: Upload target wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: pymapreduce/target/wheels/

  publish:
    name: Publish package to PyPI with Provenance
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: release
      url: https://pypi.org/p/pymapreduce-core
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
